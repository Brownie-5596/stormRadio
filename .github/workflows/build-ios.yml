name: Build iOS app

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          swift --version

      - name: Core unit tests
        working-directory: Packages/StormRadioCore
        run: swift test 2>&1 | tail -40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for sideloading)
        run: |
          set -o pipefail
          xcodebuild \
            -project StormRadio.xcodeproj \
            -scheme StormRadio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="0.2.${GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show compile errors
        if: failure()
        run: grep -n -B2 -A6 "error:" xcodebuild.log | head -300 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StormRadio.app Payload/
          zip -qry StormRadio.ipa Payload
          ls -la StormRadio.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormRadio-ipa
          path: StormRadio.ipa
          retention-days: 30

      - name: Make AltStore / SideStore source
        run: |
          NOTES="$(git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D')"
          python3 tools/make_altstore_source.py --app Payload/StormRadio.app --ipa StormRadio.ipa \
            --repo "${GITHUB_REPOSITORY}" --tag latest --notes "$NOTES" --out altstore-source.json
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png icon.png

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="0.2.${GITHUB_RUN_NUMBER}"
          NOTES="Storm Radio ${VERSION} (build ${GITHUB_RUN_NUMBER}) from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}.

          Install StormRadio.ipa with Sideloadly (install over the old app to keep settings), or add this source to SideStore/AltStore for one-tap updates:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/altstore-source.json"
          # Keep the tag on the commit that was built.
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest StormRadio.ipa altstore-source.json icon.png --clobber
            gh release edit latest --title "Storm Radio ${VERSION}" --notes "$NOTES" --prerelease
          else
            gh release create latest StormRadio.ipa altstore-source.json icon.png --prerelease \
              --title "Storm Radio ${VERSION}" --notes "$NOTES" --target "${GITHUB_SHA}"
          fi
          # Older per-branch releases are replaced by "latest".
          gh release delete "latest-${GITHUB_REF_NAME//\//-}" --cleanup-tag -y 2>/dev/null || true
